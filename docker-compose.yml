# ============================================================
#  SIDRA Dashboard 2026 — Docker Compose
#  Target: Docker running inside a Proxmox LXC container,
#  separate from the Home Assistant server (reached over LAN).
#
#  Phase 0/1 brings up: backend (Flask + HA bridge) and frontend (Next.js).
#  Phase 2/3 will add: db (Postgres) and redis (Socket.IO scale-out).
# ============================================================
services:
  backend:
    build: ./backend
    container_name: sidra-backend
    env_file: .env
    ports:
      - "5000:5000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/api/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the Next.js build. Must be the URL the browser can reach.
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL}
    container_name: sidra-frontend
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

