      - type: custom:decluttering-card
        template: premium_stack_shell
        variables:
          - card_1:
              type: vertical-stack
              cards:
                - type: custom:button-card
                  custom_fields:
                    title: |
                      [[[
                        return `<div class="dynamic-greet">live status</div>`;
                      ]]]
                    subtitle: |
                      [[[
                        function gold(num) {
                          return '<span class="count-gold">' + num + '</span>';
                        }

                        var lightsOn = parseInt(hass.states['sensor.number_lights_on']?.state || '0', 10);
                        var fansOn   = parseInt(hass.states['sensor.number_fans_on']?.state || '0', 10);
                        var plugsOn  = parseInt(hass.states['sensor.number_plugs_on']?.state || '0', 10);

                        if (isNaN(lightsOn)) lightsOn = 0;
                        if (isNaN(fansOn)) fansOn = 0;
                        if (isNaN(plugsOn)) plugsOn = 0;

                        var parts = [];

                        if (lightsOn === 1) {
                          parts.push('There is ' + gold(1) + ' light on now');
                        } else if (lightsOn > 1) {
                          parts.push('There are ' + gold(lightsOn) + ' lights on now  ,turn off all unwanted lights for energy save');
                        }

                        if (fansOn === 1) {
                          parts.push('There is ' + gold(1) + ' fan on now');
                        } else if (fansOn > 1) {
                          parts.push('There are ' + gold(fansOn) + ' fans on now, turn off fan if climate normal');
                        }

                        if (plugsOn === 1) {
                          parts.push('There is ' + gold(1) + ' plug on now');
                        } else if (plugsOn > 1) {
                          parts.push('There are ' + gold(plugsOn) + ' plugs on now ,turn off all unwanted plugs for electricity save');
                        }

                        var message = parts.join(' • ');

                        if (!message) {
                          message = 'All lights, fans and plugs are off';
                        }

                        return `
                          <div class="subtitle-box">
                            <div class="marquee-wrap">
                              <div class="marquee-fade marquee-fade-left"></div>
                              <div class="marquee-fade marquee-fade-right"></div>
                              <div class="marquee-track">
                                <div class="marquee-text dynamic-sub">
                                  <span class="marquee-item">${message}</span>
                                  <span class="marquee-separator">•</span>
                                  <span class="marquee-item">${message}</span>
                                  <span class="marquee-separator">•</span>
                                </div>
                              </div>
                            </div>
                          </div>
                        `;
                      ]]]
                  styles:
                    grid:
                      - grid-template-areas: '"title" "subtitle"'
                      - grid-template-columns: minmax(0, 1fr)
                      - grid-template-rows: min-content min-content
                      - width: 100%
                      - margin: 0
                      - padding: 0
                    card:
                      - padding: 0
                      - margin: 0
                      - width: 100%
                      - min-width: 0
                      - max-width: 100%
                      - background: transparent
                      - border: none
                      - box-shadow: none
                    custom_fields:
                      title:
                        - width: 100%
                        - min-width: 0
                        - justify-self: stretch
                        - align-self: center
                      subtitle:
                        - width: 100%
                        - min-width: 0
                        - justify-self: stretch
                        - align-self: center
                        - overflow: hidden
                        - padding: 0
                        - margin: 0
                  card_mod:
                    style: |
                      :host {
                        display: block;
                        width: 100% !important;
                        max-width: 100% !important;
                        min-width: 0 !important;
                        margin: 0 !important;
                        padding: 0 !important;
                      }

                      ha-card {
                        background: transparent !important;
                        border: none !important;
                        box-shadow: none !important;
                        text-align: center;
                        position: relative;
                        overflow: hidden !important;
                        width: 100% !important;
                        max-width: 100% !important;
                        min-width: 0 !important;
                        margin: 0 !important;
                        padding: 0 !important;
                      }

                      #root {
                        width: 100% !important;
                        max-width: 100% !important;
                        min-width: 0 !important;
                        margin: 0 !important;
                        padding: 0 !important;
                      }

                      ha-card::before {
                        content: "";
                        position: absolute;
                        left: 50%;
                        top: 42%;
                        width: 320px;
                        height: 120px;
                        transform: translate(-50%, -50%);
                        background: radial-gradient(circle, rgba(255,210,120,0.18) 0%, rgba(255,210,120,0.06) 42%, transparent 75%);
                        filter: blur(20px);
                        pointer-events: none;
                      }

                      @keyframes greetGlow {
                        0% {
                          background-position: -200% center;
                        }
                        100% {
                          background-position: 200% center;
                        }
                      }

                      @keyframes roomMarqueeSmooth {
                        0% {
                          transform: translateX(0);
                        }
                        100% {
                          transform: translateX(-50%);
                        }
                      }

                      .subtitle-box {
                        position: relative;
                        z-index: 1;
                        width: 100%;
                        max-width: 100%;
                        min-width: 0;
                        margin: 0 auto;
                        padding: 0;
                        overflow: hidden;
                        box-sizing: border-box;
                      }

                      .marquee-wrap {
                        position: relative;
                        width: 100%;
                        max-width: 100%;
                        min-width: 0;
                        overflow: hidden;
                        white-space: nowrap;
                        padding: 0;
                        margin: 0;
                        line-height: 1.25;
                        box-sizing: border-box;
                      }

                      .marquee-track {
                        display: block;
                        width: 100%;
                        max-width: 100%;
                        min-width: 0;
                        overflow: hidden;
                      }

                      .marquee-text {
                        display: inline-flex;
                        align-items: center;
                        white-space: nowrap;
                        width: max-content;
                        min-width: max-content;
                        animation: roomMarqueeSmooth 20s linear infinite;
                        will-change: transform;
                      }

                      .marquee-item {
                        display: inline-block;
                        padding-right: 1.5rem;
                      }

                      .marquee-separator {
                        display: inline-block;
                        padding-right: 1.5rem;
                        opacity: 0.7;
                      }

                      .marquee-wrap:hover .marquee-text {
                        animation-play-state: paused;
                      }

                      .marquee-fade {
                        position: absolute;
                        top: 0;
                        bottom: 0;
                        width: 32px;
                        z-index: 2;
                        pointer-events: none;
                      }

                      .marquee-fade-left {
                        left: 0;
                        background: linear-gradient(
                          to right,
                          rgba(var(--rgb-card-background-color),0.95) 0%,
                          rgba(var(--rgb-card-background-color),0) 100%
                        );
                      }

                      .marquee-fade-right {
                        right: 0;
                        background: linear-gradient(
                          to left,
                          rgba(var(--rgb-card-background-color),0.95) 0%,
                          rgba(var(--rgb-card-background-color),0) 100%
                        );
                      }

                      .dynamic-greet {
                        position: relative;
                        z-index: 1;
                        display: inline-block;
                        padding-bottom: 1rem;
                        padding-top: 1rem;
                        width: 100%;
                        font-family: "Segoe UI", "Poppins", sans-serif;
                        font-size: 1.6rem;
                        font-weight: 700;
                        line-height: 1.1;
                        letter-spacing: -0.02em;
                        text-align: center;
                        text-transform: uppercase;
                        color: transparent !important;
                        background-image: var(--sidra-heading-grad, linear-gradient(
                          110deg,
                          #d8dbe2 0%,
                          #ffffff 20%,
                          #f7d58a 40%,
                          #ffffff 60%,
                          #d8dbe2 100%
                        ));
                        background-size: 220% 100%;
                        -webkit-background-clip: text;
                        background-clip: text;
                        -webkit-text-fill-color: transparent !important;
                        animation: greetGlow 5s linear infinite;
                        text-shadow:
                          0 0 8px rgba(255,255,255,0.08),
                          0 0 18px rgba(255,210,120,0.08);
                        filter: drop-shadow(0 3px 10px rgba(0,0,0,0.35));
                        margin: 0 0 4px 0;
                        white-space: normal;
                      }

                      .dynamic-sub {
                        position: relative;
                        padding-bottom: 1rem;
                        z-index: 1;
                        font-family: "Segoe UI", "Poppins", sans-serif;
                        color: rgba(var(--rgb-primary-text-color),0.82);
                        font-size: 1.3rem;
                        font-weight: 500;
                        opacity: 0.92;
                        text-align: center;
                        line-height: 1.2;
                        letter-spacing: 0.01em;
                        text-shadow: 0 2px 10px rgba(0,0,0,0.28);
                        padding: 0 8px;
                      }

                      .count-gold {
                        color: #f7d58a;
                        font-weight: 700;
                        text-shadow:
                          0 0 8px rgba(247,213,138,0.22),
                          0 0 16px rgba(247,213,138,0.12);
                      }
