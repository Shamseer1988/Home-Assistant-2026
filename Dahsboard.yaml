      style: |
        ha-card {
          background: transparent !important;
          border: none !important;
          box-shadow: none !important;
          text-align: center;
          position: relative;
          overflow: hidden !important;
        }

        ha-card::before {
          content: "";
          position: absolute;
          left: 50%;
          top: 42%;
          width: 320px;
          height: 120px;
          transform: translate(-50%, -50%);
