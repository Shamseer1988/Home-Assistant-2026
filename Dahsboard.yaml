          filter: blur(20px);
          pointer-events: none;
        }

        @keyframes greetGlow {
          0% {
            background-position: -200% center;
          }
          100% {
            background-position: 200% center;
          }
        }

        .subtitle-box {
          position: relative;
          z-index: 1;
          width: 100%;
          max-width: 310px;
          margin: 0 auto;
          overflow: hidden;
        }

        .dynamic-greet {
          position: relative;
          z-index: 1;
          display: inline-block;
          font-family: "Segoe UI", "Poppins", sans-serif;
          font-size: 1.3rem;
          font-weight: 700;
          line-height: 1.1;
          letter-spacing: -0.02em;
          text-transform: uppercase;
          text-align: center;
          color: transparent !important;
          background-image: var(--sidra-heading-grad, linear-gradient(
            110deg,
            #d8dbe2 0%,
            #ffffff 20%,
            #f7d58a 40%,
            #ffffff 60%,
            #d8dbe2 100%
          ));
          background-size: 220% 100%;
          -webkit-background-clip: text;
          background-clip: text;
          -webkit-text-fill-color: transparent !important;
          animation: greetGlow 15s linear infinite;
          text-shadow:
            0 0 8px rgba(255,255,255,0.08),
            0 0 18px rgba(255,210,120,0.08);
          filter: drop-shadow(0 3px 10px rgba(0,0,0,0.35));
          margin: 0 0 4px 0;
          white-space: normal;
        }

        .dynamic-sub {
          position: relative;
          z-index: 1;
          font-family: "Segoe UI", "Poppins", sans-serif;
          color: rgba(var(--rgb-primary-text-color),0.82);
          font-size: 1rem;
          font-weight: 500;
          opacity: 0.92;
          text-align: center;
          line-height: 1.2;
          letter-spacing: 0.01em;
          text-shadow: 0 2px 10px rgba(0,0,0,0.28);
        }

        .count-gold {
          font-weight: 700;
          letter-spacing: 0.02em;
          color: transparent;
          display: inline !important;
          padding-right: 0 !important;
          margin-right: 0 !important;
          background-image: linear-gradient(
            110deg,
            #8f6518 0%,
            #d9a441 20%,
            #fff6cf 40%,
            #f3c96d 60%,
            #a8741d 80%,
            #8f6518 100%
          );
          background-size: 200% 100%;
          -webkit-background-clip: text;
          background-clip: text;
          -webkit-text-fill-color: transparent;
          animation: goldPulse 3s linear infinite;
          text-shadow:
            0 0 6px rgba(255,210,120,0.15),
            0 0 12px rgba(255,180,80,0.10);
        }
  section_heading_scroll:
    template: section_heading_static
    card_mod:
      style: |
        ha-card {
          background: transparent !important;
          border: none !important;
          box-shadow: none !important;
          text-align: center;
          position: relative;
          overflow: hidden !important;
        }

        ha-card::before {
          content: "";
          position: absolute;
          left: 50%;
          top: 42%;
          width: 320px;
          height: 120px;
          transform: translate(-50%, -50%);
          background: radial-gradient(circle, rgba(255,210,120,0.18) 0%, rgba(255,210,120,0.06) 42%, transparent 75%);
          filter: blur(20px);
          pointer-events: none;
        }

        @keyframes greetGlow {
          0% {
            background-position: -200% center;
          }
          100% {
            background-position: 200% center;
          }
        }

        @keyframes roomMarqueeSmooth {
          0% {
            transform: translate3d(0, 0, 0);
          }
          100% {
            transform: translate3d(-50%, 0, 0);
          }
        }

        @keyframes goldPulse {
          0% {
            background-position: -200% center;
          }
          100% {
            background-position: 200% center;
          }
        }

        .subtitle-box {
          position: relative;
          z-index: 1;
          width: 100%;
          max-width: 310px;
          margin: 0 auto;
          overflow: hidden;
        }

        .marquee-wrap {
          position: relative;
          width: 100%;
          overflow: hidden;
          white-space: nowrap;
          padding: 0;
          line-height: 1.25;
        }

        .marquee-text {
          display: inline-flex;
          align-items: center;
          white-space: nowrap;
          width: max-content;
          animation: roomMarqueeSmooth 18s linear infinite;
          will-change: transform;
          transform: translate3d(0, 0, 0);
          backface-visibility: hidden;
        }

        .marquee-item {
          display: inline-block;
          padding-right: 4rem;
        }

        .marquee-wrap:hover .marquee-text {
          animation-play-state: paused;
        }

        .marquee-fade {
          position: absolute;
          top: 0;
          bottom: 0;
          width: 28px;
          z-index: 2;
          pointer-events: none;
        }

        .marquee-fade-left {
          left: 0;
          background: linear-gradient(
            to right,
            rgba(var(--rgb-card-background-color),0.95) 0%,
            rgba(var(--rgb-card-background-color),0) 100%
          );
        }

        .marquee-fade-right {
          right: 0;
          background: linear-gradient(
            to left,
            rgba(var(--rgb-card-background-color),0.95) 0%,
            rgba(var(--rgb-card-background-color),0) 100%
          );
        }

        .dynamic-greet {
