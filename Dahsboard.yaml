                      entity_id: script.tuya_integration_reload_script
                    data: {}
              card_mod:
                style: |
                  ha-card {
                    background: transparent !important;
                    border: none !important;
                    box-shadow: none !important;
                    padding: 4px 2px !important;
                  }

                  .chips {
                    justify-content: center !important;
                    gap: 10px !important;
                    flex-wrap: wrap !important;
                  }

                  mushroom-template-chip,
                  mushroom-entity-chip,
                  mushroom-weather-chip,
                  mushroom-alarm-control-panel-chip {
                    --chip-height: 42px;
                    --chip-border-radius: 999px;
                    --chip-background: linear-gradient(
                      180deg,
                      rgba(var(--rgb-primary-text-color),0.08),
                      rgba(var(--rgb-primary-text-color),0.03)
                    );
                    --chip-box-shadow:
                      0 8px 18px rgba(0,0,0,0.22),
                      inset 0 1px 0 rgba(255,255,255,0.08);
                  }
          - card_2:
              type: custom:button-card
              show_icon: false
              show_name: false
              show_state: false
              custom_fields:
                summary: |
                  [[[
                    var lightsOn = parseInt(states['sensor.number_lights_on'] ? states['sensor.number_lights_on'].state : '0', 10);
                    if (isNaN(lightsOn)) lightsOn = 0;

                    var fansOn = 0;
                    var socketsOn = 0;
                    var key;

                    for (key in states) {
                      if (states[key].entity_id.indexOf('fan.') === 0 && states[key].state === 'on') fansOn++;
                      if (states[key].entity_id.indexOf('switch.') === 0 && states[key].state === 'on') socketsOn++;
                    }

                    return ''
                      + '<div class="status-summary-grid">'
                      + '  <div class="status-pill">'
                      + '    <div class="status-pill-icon"><ha-icon icon="mdi:lightbulb-group-outline"></ha-icon></div>'
                      + '    <div class="status-pill-info"><div class="v">' + lightsOn + '</div><div class="k">Lights On</div></div>'
                      + '  </div>'
                      + '  <div class="status-pill">'
                      + '    <div class="status-pill-icon"><ha-icon icon="mdi:fan"></ha-icon></div>'
                      + '    <div class="status-pill-info"><div class="v">' + fansOn + '</div><div class="k">Fans On</div></div>'
                      + '  </div>'
                      + '  <div class="status-pill">'
                      + '    <div class="status-pill-icon"><ha-icon icon="mdi:power-socket-eu"></ha-icon></div>'
                      + '    <div class="status-pill-info"><div class="v">' + socketsOn + '</div><div class="k">Sockets On</div></div>'
                      + '  </div>'
                      + '</div>';
                  ]]]
              styles:
                grid:
                  - grid-template-areas: '"summary"'
                  - grid-template-columns: 1fr
                card:
                  - background: transparent
                  - border: none
                  - box-shadow: none
                  - padding: 0
              card_mod:
                style: |
                  ha-card {
                    background: transparent !important;
                    border: none !important;
                    box-shadow: none !important;
                    padding: 0 !important;
                  }

                  .status-summary-grid {
                    display: grid;
                    grid-template-columns: repeat(3, minmax(0, 1fr));
                    gap: 12px;
                  }

                  .status-pill {
                    display: grid;
                    grid-template-columns: 46px 1fr;
                    gap: 10px;
                    align-items: center;
                    padding: 14px 14px;
                    border-radius: 22px;
                    background: linear-gradient(180deg, rgba(var(--rgb-primary-text-color),0.07), rgba(var(--rgb-primary-text-color),0.03));
                    border: 1px solid rgba(var(--rgb-primary-text-color),0.08);
                    box-shadow:
                      0 10px 24px rgba(0,0,0,0.20),
                      inset 0 1px 0 rgba(255,255,255,0.05);
                  }

                  .status-pill-icon {
                    width: 46px;
                    height: 46px;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    border-radius: 16px;
                    background: rgba(var(--rgb-primary-text-color),0.06);
                    box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
                  }

                  .status-pill-icon ha-icon {
                    color: rgba(255,210,120,0.95);
                    width: 24px;
                    height: 24px;
                  }

                  .status-pill-info .v {
                    font-size: 1.2rem;
                    font-weight: 800;
                    line-height: 1;
                  }

                  .status-pill-info .k {
                    margin-top: 5px;
                    font-size: 0.78rem;
                    opacity: 0.72;
                    font-weight: 600;
                    letter-spacing: 0.04em;
                  }
