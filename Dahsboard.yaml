                      const level = parseFloat(states['sensor.ultrasonic_tank_water_tank_level_level']?.state || 0);
                      const distance = parseFloat(states['sensor.ultrasonic_tank_water_tank_level_distance']?.state || 0);
                      const liters = parseFloat(states['sensor.ultrasonic_tank_water_tank_level_liters']?.state || 0);
                      const low = states['binary_sensor.ultrasonic_tank_water_tank_level_low']?.state === 'on';
                      const full = states['binary_sensor.ultrasonic_tank_water_tank_level_full']?.state === 'on';
                      const motor = states['switch.water_motor_switch_1']?.state === 'on';

                      let fillTop = '#34d399';
                      let fillBottom = '#0ea5e9';
                      if (p < 25) { fillTop = '#fb7185'; fillBottom = '#ef4444'; }
                      else if (p < 50) { fillTop = '#fbbf24'; fillBottom = '#f97316'; }

                      return `
                        <div class="tank-wrap">
                          <div class="tank-shell">
                            <div class="tank-glass"></div>
                            <div class="tank-fill" style="height:${p}%; background: linear-gradient(180deg, ${fillTop}, ${fillBottom});">
                              <div class="wave wave-a"></div>
                              <div class="wave wave-b"></div>
                            </div>

                            <div class="tank-topshine"></div>

                            ${motor ? `<div class="motor-orb"></div><div class="motor-chip">MOTOR ON</div>` : `<div class="motor-chip off">MOTOR OFF</div>`}
                            ${low ? `<div class="status-badge low">LOW</div>` : ``}
                            ${full ? `<div class="status-badge full">FULL</div>` : ``}

                            <div class="tank-center">
                              <div class="tank-percent">${Math.round(p)}%</div>
                              <div class="tank-meta">${Math.round(level)} cm</div>
                              <div class="tank-meta">${Math.round(liters)} L</div>
                              <div class="tank-meta">Dist ${Math.round(distance)} cm</div>
                            </div>

                            <div class="motor-control">
                              <ha-icon icon="mdi:engine" class="motor-icon"></ha-icon>
                              <div class="motor-btn ${motor ? 'on' : ''}">${motor ? 'ON' : 'OFF'}</div>
                            </div>
                          </div>
                        </div>
                      `;
