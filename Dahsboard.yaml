title: SIDRA
decluttering_templates:
  premium_stack_shell:
    default:
      - card_1:
          type: custom:button-card
          styles:
            card:
              - display: none
      - card_2:
          type: custom:button-card
          styles:
            card:
              - display: none
      - card_3:
          type: custom:button-card
          styles:
            card:
              - display: none
    card:
      type: custom:stack-in-card
      card_mod:
        style: |
          ha-card {
            --hero-bg-1: color-mix(in srgb, var(--card-background-color) 78%, #0b1630 22%);
            --hero-bg-2: color-mix(in srgb, var(--card-background-color) 68%, #13264d 32%);
            position: relative;
            overflow: hidden;
            border-radius: 34px;
            padding: 3px !important;
            background:
              radial-gradient(circle at top left, rgba(77,121,255,0.18) 0%, transparent 32%),
              radial-gradient(circle at bottom right, rgba(89,160,255,0.10) 0%, transparent 34%),
              linear-gradient(145deg, var(--hero-bg-1) 0%, var(--hero-bg-2) 100%);
            border: 1px solid rgba(var(--rgb-primary-text-color),0.08);
            box-shadow:
              0 18px 40px rgba(0,0,0,0.22),
              0 0 0 1px rgba(255,255,255,0.03) inset,
              0 0 22px rgba(68,110,255,0.08);
            backdrop-filter: blur(14px) saturate(140%);
            -webkit-backdrop-filter: blur(14px) saturate(140%);
          }

          ha-card::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 34px;
            pointer-events: none;
            background: linear-gradient(
              135deg,
              rgba(255,255,255,0.08) 0%,
              rgba(255,255,255,0.03) 18%,
              rgba(255,255,255,0.00) 45%
            );
          }

          #root {
            margin: 0 !important;
            padding: 0 !important;
            display: flex !important;
            flex-direction: column !important;
            justify-content: center !important;
            align-items: center !important;
            min-height: 120px !important;
            box-sizing: border-box !important;
          }

          #root > * {
            margin: 0 !important;
            padding: 0 !important;
            width: 100%;
          }

          #root > *:not(:last-child) {
            margin-bottom: 0 !important;
          }
      cards:
        - '[[card_1]]'
        - '[[card_2]]'
        - '[[card_3]]'
  popup_header_with_close:
    card:
      type: horizontal-stack
      cards:
        - type: custom:button-card
          show_icon: false
          show_name: false
          show_state: false
          tap_action:
            action: none
          hold_action:
            action: none
          custom_fields:
            title: |
              [[[
                return `<div class="dynamic-greet">[[title]]</div>`;
              ]]]
            subtitle: ''
          styles:
            grid:
              - grid-template-areas: '"title" "subtitle"'
              - grid-template-columns: 1fr
              - grid-template-rows: min-content min-content
              - justify-items: start
              - align-items: start
              - row-gap: 2px
            card:
              - position: relative
              - overflow: hidden
              - background: transparent
              - box-shadow: none
              - border: none
              - padding: 8px 8px 12px 8px
            custom_fields:
              title:
                - justify-self: start
                - align-self: start
                - text-align: left
                - width: 100%
              subtitle:
                - justify-self: start
                - align-self: start
                - text-align: left
                - width: 100%
          card_mod:
            style: |
              ha-card {
                background: transparent !important;
                border: none !important;
                box-shadow: none !important;
                text-align: left;
                position: relative;
                min-height: 72px;
              }

              ha-card::before {
                content: "";
                position: absolute;
                left: 140px;
                top: 34px;
                width: 240px;
                height: 70px;
                transform: translate(-50%, -50%);
                background: radial-gradient(
                  circle,
                  rgba(255,210,120,0.16) 0%,
                  rgba(255,210,120,0.05) 42%,
                  transparent 75%
                );
                filter: blur(18px);
                pointer-events: none;
                z-index: 0;
              }

                @keyframes greetGlow {
                0% {
                  background-position: -200% center;
                }
                100% {
                  background-position: 200% center;
                }
               }


              .dynamic-greet {
                position: relative;
                z-index: 1;
                display: block;
                font-family: "Segoe UI", "Poppins", sans-serif;
                font-size: 1.6rem;
                font-weight: 700;
                line-height: 1.1;
                letter-spacing: -0.02em;
                text-align: left;
                color: transparent !important;
                background-image: var(--sidra-heading-grad, linear-gradient(
                  110deg,
                  #d8dbe2 0%,
                  #ffffff 20%,
                  #f7d58a 40%,
                  #ffffff 60%,
                  #d8dbe2 100%
                ));
                background-size: 220% 100%;
                -webkit-background-clip: text;
                background-clip: text;
                -webkit-text-fill-color: transparent !important;
                animation: greetGlow 5s linear infinite;
                text-shadow:
                  0 0 8px rgba(255,255,255,0.08),
                  0 0 18px rgba(255,210,120,0.08);
                filter: drop-shadow(0 3px 10px rgba(0,0,0,0.35));
                margin: 6px 0 4px 0;
              }
        - type: custom:button-card
          icon: mdi:close
          show_name: false
          show_state: false
          tap_action:
            action: fire-dom-event
            browser_mod:
              service: browser_mod.close_popup
          styles:
            card:
              - width: 44px
              - height: 44px
              - padding: 0
              - border-radius: 50%
              - background: rgba(var(--rgb-primary-text-color),0.08)
              - border: 1px solid rgba(var(--rgb-primary-text-color),0.14)
              - box-shadow: |
                  0 8px 20px rgba(0,0,0,0.35),
                  inset 0 1px 0 rgba(255,255,255,0.06),
                  0 0 14px rgba(255,210,120,0.18)
            grid:
              - grid-template-areas: '"i"'
              - grid-template-columns: 1fr
              - grid-template-rows: 1fr
              - justify-items: center
              - align-items: center
            icon:
              - width: 20px
              - height: 20px
              - color: rgba(var(--rgb-primary-text-color),0.95)
          card_mod:
            style: |
              ha-card {
                backdrop-filter: blur(14px);
                -webkit-backdrop-filter: blur(14px);
                animation: closePulse 2.4s ease-in-out infinite;
                transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
              }

              ha-card:hover {
                transform: scale(1.08);
                background: rgba(var(--rgb-primary-text-color),0.14) !important;
                box-shadow:
                  0 10px 24px rgba(0,0,0,0.40),
                  inset 0 1px 0 rgba(255,255,255,0.08),
                  0 0 18px rgba(255,210,120,0.42);
              }

              ha-card:active {
                transform: scale(0.92);
              }

              @keyframes closePulse {
                0% {
                  box-shadow:
                    0 8px 20px rgba(0,0,0,0.35),
                    inset 0 1px 0 rgba(255,255,255,0.06),
                    0 0 0 rgba(255,210,120,0);
                }
                50% {
                  box-shadow:
                    0 8px 20px rgba(0,0,0,0.35),
                    inset 0 1px 0 rgba(255,255,255,0.06),
                    0 0 16px rgba(255,210,120,0.32);
                }
                100% {
                  box-shadow:
                    0 8px 20px rgba(0,0,0,0.35),
                    inset 0 1px 0 rgba(255,255,255,0.06),
                    0 0 0 rgba(255,210,120,0);
                }
              }
      card_mod:
        style: |
          :host {
            display: block;
          }
          hui-horizontal-stack-card {
            gap: 0 !important;
          }
          #root {
            display: grid !important;
            grid-template-columns: 1fr auto !important;
            align-items: start !important;
          }
button_card_templates:
  section_heading_static:
    show_icon: false
    show_name: false
    show_state: false
    tap_action:
      action: none
    hold_action:
      action: none
    custom_fields:
      title: |
        [[[
          return `<div class="dynamic-greet sidra-shimmer">${variables.heading_title}</div>`;
        ]]]
      subtitle: |
        [[[
          return `<div class="subtitle-static dynamic-sub ">${variables.heading_subtitle}</div>`;
        ]]]
    styles:
      grid:
        - grid-template-areas: '"title" "subtitle"'
        - grid-template-columns: 1fr
        - grid-template-rows: min-content min-content
        - justify-items: center
        - align-items: center
        - row-gap: 6px
      card:
        - position: relative
        - overflow: hidden
        - background: transparent
        - box-shadow: none
        - border: none
        - padding: 8px 6px 6px 6px
      custom_fields:
        title:
