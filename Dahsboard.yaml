          - card_2:
              type: custom:button-card
              show_icon: false
              show_name: false
              show_state: false
              tap_action:
                action: none
              hold_action:
                action: none
              custom_fields:
                alert: |
                  [[[
                    var allStates = Object.values(hass.states);
                    var batteries = [];
                    var i, s, val;

                    for (i = 0; i < allStates.length; i++) {
                      s = allStates[i];
                      val = parseFloat(s.state);

                      if (
                        s.entity_id.indexOf('sensor.') === 0 &&
                        (s.attributes.device_class === 'battery' || s.entity_id.indexOf('battery') !== -1) &&
                        !isNaN(val) &&
                        s.state !== 'unknown' &&
                        s.state !== 'unavailable'
                      ) {
                        batteries.push(s);
                      }
                    }

                    var critical = 0;
                    var low = 0;
                    var totalLow = 0;

                    for (i = 0; i < batteries.length; i++) {
                      val = parseFloat(batteries[i].state);
                      if (val <= 10) {
                        critical++;
                        totalLow++;
                      } else if (val <= 50) {
                        low++;
                        totalLow++;
                      }
                    }

                    var icon = 'mdi:battery-heart-variant';
                    var iconClass = 'ok';
                    var title = 'All devices healthy';
                    var subtitle = 'No low battery alerts detected';

                    if (critical > 0) {
                      icon = 'mdi:battery-alert-variant-outline';
                      iconClass = 'critical';
                      title = critical + ' critical battery alert' + (critical > 1 ? 's' : '');
                      subtitle = low > 0
                        ? low + ' additional low battery device' + (low > 1 ? 's' : '')
                        : 'Immediate attention required';
                    } else if (totalLow > 0) {
                      icon = 'mdi:battery-low';
                      iconClass = 'low';
                      title = totalLow + ' low battery device' + (totalLow > 1 ? 's' : '');
                      subtitle = 'Replacement or charging recommended';
                    }

                    return ''
                      + '<div class="battery-alert-wrap ' + iconClass + '">'
                      + '  <div class="battery-alert-icon">'
                      + '    <ha-icon icon="' + icon + '"></ha-icon>'
                      + '  </div>'
                      + '  <div class="battery-alert-text">'
                      + '    <div class="battery-alert-title">' + title + '</div>'
                      + '    <div class="battery-alert-subtitle">' + subtitle + '</div>'
                      + '  </div>'
                      + '  <div class="battery-alert-count">'
                      + '    <div class="count-main">' + totalLow + '</div>'
                      + '    <div class="count-label">ALERTS</div>'
                      + '  </div>'
                      + '</div>';
                  ]]]
              styles:
                grid:
                  - grid-template-areas: '"alert"'
                  - grid-template-columns: 1fr
                card:
                  - padding: 0
                  - background: transparent
                  - border: none
                  - box-shadow: none
              card_mod:
                style: |
                  ha-card {
                    background: transparent !important;
                    border: none !important;
                    box-shadow: none !important;
                    padding: 0 !important;
                  }

                  @keyframes batteryCriticalPulse {
                    0% { box-shadow: 0 0 0 0 rgba(255,95,87,0.28); }
                    70% { box-shadow: 0 0 0 12px rgba(255,95,87,0); }
                    100% { box-shadow: 0 0 0 0 rgba(255,95,87,0); }
                  }

                  .battery-alert-wrap {
                    display: grid;
                    grid-template-columns: 54px 1fr auto;
                    gap: 12px;
                    align-items: center;
                    padding: 14px 16px;
                    border-radius: 24px;
                    position: relative;
                    overflow: hidden;
                    border: 1px solid rgba(var(--rgb-primary-text-color),0.08);
                    background: linear-gradient(180deg, rgba(var(--rgb-card-background-color),0.82), rgba(var(--rgb-card-background-color),0.60));
                    box-shadow:
                      0 14px 30px rgba(0,0,0,0.28),
                      inset 0 1px 0 rgba(255,255,255,0.06);
                    backdrop-filter: blur(10px);
                    -webkit-backdrop-filter: blur(10px);
                  }

                  .battery-alert-wrap::before {
                    content: "";
                    position: absolute;
                    inset: 0;
                    background:
                      radial-gradient(circle at top left, rgba(255,210,120,0.14), transparent 34%),
                      radial-gradient(circle at bottom right, rgba(99,102,241,0.08), transparent 36%);
                    pointer-events: none;
                  }

                  .battery-alert-wrap.low {
                    border-color: rgba(245,196,81,0.24);
                  }

                  .battery-alert-wrap.critical {
                    border-color: rgba(255,95,87,0.30);
                    animation: batteryCriticalPulse 2.1s infinite;
                  }

                  .battery-alert-icon,
                  .battery-alert-text,
                  .battery-alert-count {
                    position: relative;
                    z-index: 1;
                  }

                  .battery-alert-icon {
                    width: 54px;
                    height: 54px;
                    border-radius: 18px;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    background: rgba(var(--rgb-primary-text-color),0.06);
