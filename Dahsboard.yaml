              custom_fields:
                summary: |
                  [[[
                    var alarm = states['alarm_control_panel.alarmo'];
                    var alarmState = alarm ? alarm.state : 'unknown';

                    var doorEntities = [
                      'binary_sensor.sonoff_door_sensor_kitchen_contact',
                      'binary_sensor.sonoff_door_sensor_main_door_contact',
                      'binary_sensor.sonoff_door_sensor_master_bed_contact',
                      'binary_sensor.door_detector_upstair_main',
                      'binary_sensor.upstair_terrace_door_sensor',
                      'binary_sensor.sonoff_kitchen_storeroom_door_sensor_contact_contact'
                    ];

                    var motionEntities = [
                      'binary_sensor.sonoff_motion_sensor_master_bed_main_occupancy',
                      'binary_sensor.sonoff_motion_sensor_living_1_occupancy',
                      'binary_sensor.human_presence_kitchen_zigbee_presence',
                      'binary_sensor.human_presence_passage_zigbee_presence'
                    ];

                    var openDoors = 0;
                    var motionActive = 0;
                    var i, e;

                    for (i = 0; i < doorEntities.length; i++) {
                      e = states[doorEntities[i]];
                      if (e && e.state === 'on') openDoors++;
                    }

                    for (i = 0; i < motionEntities.length; i++) {
                      e = states[motionEntities[i]];
                      if (e && e.state === 'on') motionActive++;
                    }

                    var shieldIcon = 'mdi:shield-check';
                    var shieldColor = '#7bd88f';
                    var title = 'Secure';
                    var sub = 'All monitored zones look normal';

                    if (alarmState === 'armed_home' || alarmState === 'armed_away') {
                      shieldIcon = 'mdi:shield-lock';
                      shieldColor = '#f5c451';
                      title = 'Armed';
                      sub = alarmState.replace(/_/g, ' ');
                    }

                    if (openDoors > 0 || motionActive > 0) {
                      shieldIcon = 'mdi:shield-alert';
                      shieldColor = '#ff5f57';
                      title = 'Attention';
                      sub = 'Open zones or movement detected';
                    }

                    return ''
                      + '<div class="security-hero-wrap">'
                      + '  <div class="security-hero-main">'
                      + '    <div class="security-hero-icon" style="color:' + shieldColor + ';"><ha-icon icon="' + shieldIcon + '"></ha-icon></div>'
                      + '    <div class="security-hero-text">'
                      + '      <div class="security-hero-title">' + title + '</div>'
                      + '      <div class="security-hero-sub">' + sub + '</div>'
                      + '    </div>'
                      + '  </div>'
                      + '  <div class="security-mini">'
                      + '    <div class="num">' + openDoors + '</div>'
                      + '    <div class="lbl">Open Doors</div>'
                      + '  </div>'
                      + '  <div class="security-mini">'
                      + '    <div class="num">' + motionActive + '</div>'
                      + '    <div class="lbl">Motion</div>'
                      + '  </div>'
                      + '  <div class="security-mini">'
                      + '    <div class="num">' + alarmState.replace(/_/g, " ") + '</div>'
                      + '    <div class="lbl">Alarm State</div>'
                      + '  </div>'
                      + '</div>';
                  ]]]
