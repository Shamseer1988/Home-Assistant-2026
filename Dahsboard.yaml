            #d8dbe2 0%,
            #ffffff 20%,
            #f7d58a 40%,
            #ffffff 60%,
            #d8dbe2 100%
          ));
          background-size: 220% 100%;
          -webkit-background-clip: text;
          background-clip: text;
          -webkit-text-fill-color: transparent !important;
          animation: greetGlow 15s linear infinite;
          text-shadow:
            0 0 8px rgba(255,255,255,0.08),
            0 0 18px rgba(255,210,120,0.08);
          filter: drop-shadow(0 3px 10px rgba(0,0,0,0.35));
          margin: 0 0 4px 0;
          white-space: normal;
        }

        .dynamic-sub {
          position: relative;
          z-index: 1;
          font-family: "Segoe UI", "Poppins", sans-serif;
          color: rgba(var(--rgb-primary-text-color),0.82);
          font-size: 1rem;
          font-weight: 500;
          opacity: 0.92;
          text-align: center;
          line-height: 1.2;
          letter-spacing: 0.01em;
          text-shadow: 0 2px 10px rgba(0,0,0,0.28);
        }
  ultra_cctv_header:
    show_icon: false
    show_name: false
    show_state: false
    tap_action:
      action: none
    hold_action:
      action: none
    variables:
      cctv_title: CCTV MONITOR
      cctv_subtitle: Live security views • premium control center
      cctv_badge: LIVE
      cctv_icon: mdi:cctv
    custom_fields:
      head: |
        [[[
          return `
            <div class="cctv-head-wrap">
              <div class="cctv-left">
                <div class="cctv-icon-ring">
                  <ha-icon icon="${variables.cctv_icon}" class="cctv-icon"></ha-icon>
                </div>
                <div class="cctv-texts">
                  <div class="cctv-title">${variables.cctv_title}</div>
                  <div class="cctv-subtitle">${variables.cctv_subtitle}</div>
                </div>
              </div>
              <div class="cctv-badge">${variables.cctv_badge}</div>
            </div>
          `;
        ]]]
    styles:
      grid:
        - grid-template-areas: '"head"'
        - grid-template-columns: 1fr
        - grid-template-rows: min-content
      card:
        - background: transparent
        - border: none
        - box-shadow: none
        - padding: 12px 14px 10px 14px
        - margin: 0
      custom_fields:
        head:
          - width: 100%
    extra_styles: |
      @keyframes cctvGlowMove {
        0% { background-position: 0% 50%; }
        100% { background-position: 200% 50%; }
      }

      @keyframes cctvPulse {
        0%, 100% { transform: scale(1); opacity: 0.95; }
        50% { transform: scale(1.06); opacity: 1; }
      }

      .cctv-head-wrap {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        width: 100%;
      }

      .cctv-left {
        display: flex;
        align-items: center;
        gap: 14px;
        min-width: 0;
      }

      .cctv-icon-ring {
        width: 56px;
        height: 56px;
        border-radius: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(circle at 30% 30%, rgba(255,220,140,0.42), rgba(255,187,92,0.10) 45%, rgba(255,255,255,0.04) 100%);
        border: 1px solid rgba(var(--rgb-primary-text-color),0.10);
        box-shadow:
          0 0 0 1px rgba(255,255,255,0.03) inset,
          0 10px 25px rgba(0,0,0,0.22),
          0 0 20px rgba(255,205,120,0.14);
        flex-shrink: 0;
      }

      .cctv-icon {
        color: rgba(255,221,140,0.98);
        width: 26px;
        height: 26px;
      }

      .cctv-texts {
        min-width: 0;
      }

      .cctv-title {
        font-size: 20px;
        font-weight: 800;
        letter-spacing: 1.8px;
        line-height: 1.08;
        background: linear-gradient(
          90deg,
          rgba(255,243,204,0.98) 0%,
          rgba(255,215,120,1) 18%,
          rgba(255,248,220,0.98) 35%,
          rgba(255,199,92,1) 50%,
          rgba(255,243,204,0.98) 68%,
          rgba(255,215,120,1) 84%,
          rgba(255,248,220,0.98) 100%
        );
        background-size: 220% auto;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: cctvGlowMove 6s linear infinite;
        text-shadow: 0 0 18px rgba(255,210,120,0.12);
      }

      .cctv-subtitle {
        margin-top: 5px;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.45px;
        color: rgba(var(--rgb-primary-text-color),0.68);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .cctv-badge {
        flex-shrink: 0;
        padding: 7px 12px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 1.2px;
        color: #fff6df;
        background: linear-gradient(135deg, rgba(255,90,90,0.88), rgba(255,145,75,0.72));
        border: 1px solid rgba(var(--rgb-primary-text-color),0.14);
        box-shadow:
          0 8px 20px rgba(255,90,90,0.18),
          inset 0 1px 0 rgba(255,255,255,0.18);
        animation: cctvPulse 2s ease-in-out infinite;
      }
  room_device:
    show_icon: true
    show_name: true
    show_state: true
    tap_action:
      action: toggle
      haptic: light
    hold_action:
      action: more-info
      haptic: medium
    size: 28px
    styles:
      grid:
        - grid-template-areas: '"i" "n" "s"'
        - grid-template-columns: 1fr
        - grid-template-rows: auto auto auto
        - justify-items: center
        - align-items: center
        - text-align: center
        - row-gap: 6px
      card:
        - position: relative
        - overflow: hidden
        - height: 112px
        - border-radius: 24px
        - padding: 12px 10px
        - border: none
        - background: >-
            linear-gradient(180deg, rgba(var(--rgb-card-background-color),0.88),
            rgba(var(--rgb-card-background-color),0.68))
        - box-shadow: 0 10px 22px rgba(0,0,0,0.20), inset 0 1px 0 rgba(255,255,255,0.04)
      img_cell:
        - display: flex
        - justify-content: center
        - align-items: center
        - width: 100%
        - height: 32px
        - margin: 0
      icon:
        - width: 24px
        - height: 24px
        - color: '#78a9f5'
      name:
        - color: rgba(var(--rgb-primary-text-color),0.90)
        - font-size: 11px
        - font-weight: 700
        - text-align: center
        - line-height: 1.2
      state:
        - font-size: 10px
        - font-weight: 800
        - letter-spacing: 0.08em
        - text-transform: uppercase
        - text-align: center
        - color: rgba(var(--rgb-primary-text-color),0.55)
    state:
      - value: 'on'
        styles:
          card:
            - background: >-
                linear-gradient(180deg, rgba(128,78,20,0.96),
                rgba(78,48,12,0.90))
            - box-shadow: >-
                0 10px 22px rgba(0,0,0,0.20), inset 0 1px 0
                rgba(255,255,255,0.06), 0 0 18px rgba(255,186,92,0.18)
          icon:
            - color: '#ffd089'
          name:
            - color: '#fff4df'
          state:
            - color: '#ffd089'
      - value: 'off'
        styles:
          icon:
            - color: '#78a9f5'
          name:
            - color: rgba(var(--rgb-primary-text-color),0.90)
          state:
            - color: rgba(var(--rgb-primary-text-color),0.55)
    card_mod:
      style: |
        ha-card {
          position: relative;
          overflow: hidden !important;
          border-radius: 24px !important;
        }
        ha-card::before {
          content: "";
