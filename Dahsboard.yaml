                      width: 124%;
                      height: 34px;
                      border-radius: 45%;
                      background: rgba(255,255,255,0.22);
                      top: -12px;
                    }
                    #container .wave-a {
                      animation: waveMoveA 3.4s ease-in-out infinite;
                      opacity: 0.9;
                    }
                    #container .wave-b {
                      animation: waveMoveB 4.8s ease-in-out infinite;
                      opacity: 0.45;
