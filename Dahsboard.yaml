                    subtitle: |
                      [[[
                        function gold(num) {
                          return '<span class="count-gold">' + num + '</span>';
                        }

                        var lightsOn = parseInt(hass.states['sensor.number_lights_on']?.state || '0', 10);
                        var fansOn = parseInt(hass.states['sensor.number_fans_on']?.state || '0', 10);

                        if (isNaN(lightsOn)) lightsOn = 0;
                        if (isNaN(fansOn)) fansOn = 0;

                        var parts = [];

                        if (lightsOn === 1) {
                          parts.push('There is ' + gold(1) + ' light on now');
                        } else if (lightsOn > 1) {
                          parts.push('There are ' + gold(lightsOn) + ' lights on now');
                        }

                        if (fansOn === 1) {
                          parts.push('There is ' + gold(1) + ' fan on now');
                        } else if (fansOn > 1) {
                          parts.push('There are ' + gold(fansOn) + ' fans on now');
                        }

                        var message = parts.join(' • ');

                        if (!message) {
                          message = 'All lights and fans are off';
                        }

                        return `
                          <div class="subtitle-box">
                            <div class="marquee-wrap">
                              <div class="marquee-fade marquee-fade-left"></div>
                              <div class="marquee-fade marquee-fade-right"></div>
                              <div class="marquee-text dynamic-sub">
                                <span class="marquee-item">${message}</span>
                                <span class="marquee-item">${message}</span>
