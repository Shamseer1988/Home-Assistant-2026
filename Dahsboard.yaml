        variables:
          - card_1:
              type: vertical-stack
              cards:
                - type: custom:button-card
                  template: section_heading_scroll
                  custom_fields:
                    title: |
                      [[[
                        return `<div class="dynamic-greet">Persons</div>`;
                      ]]]
                    subtitle: |
                      [[[
                        var persons = [
                          'person.shamseer',
                          'person.amalnisa'
                        ];

                        function formatText(txt) {
                          if (!txt) return "Unknown";
                          return txt
                            .replace(/_/g, ' ')
                            .replace(/\b\w/g, function(c) { return c.toUpperCase(); });
                        }

                        function escapeHtml(str) {
                          return String(str)
                            .replace(/&/g, '&amp;')
                            .replace(/</g, '&lt;')
                            .replace(/>/g, '&gt;')
                            .replace(/"/g, '&quot;')
                            .replace(/'/g, '&#039;');
                        }

                        var states = [];
                        for (var i = 0; i < persons.length; i++) {
                          if (hass.states[persons[i]]) {
                            states.push(hass.states[persons[i]]);
                          }
                        }

                        var message = "Presence data unavailable";

                        if (states.length > 0) {
                          var allHome = true;
                          var allOutside = true;
                          var samePlace = true;
                          var firstState = states[0].state;

                          for (var j = 0; j < states.length; j++) {
                            if (states[j].state !== 'home') {
                              allHome = false;
                            }
                            if (states[j].state !== 'not_home') {
                              allOutside = false;
                            }
                            if (states[j].state !== firstState) {
                              samePlace = false;
                            }
                          }

                          if (allHome) {
                            message = "All are at home";
                          } else if (allOutside) {
                            message = "All are outside";
                          } else if (samePlace && firstState !== 'home' && firstState !== 'not_home') {
                            message = "All are in " + formatText(firstState);
                          } else {
                            var parts = [];

                            for (var k = 0; k < states.length; k++) {
                              var p = states[k];
                              var name = p.attributes.friendly_name ? p.attributes.friendly_name : "Unknown";
                              var state = p.state;

                              if (state === 'home') {
                                parts.push(escapeHtml(name) + " is at home");
                              } else if (state === 'not_home') {
                                parts.push(escapeHtml(name) + " is outside");
                              } else {
                                parts.push(escapeHtml(name) + " is in " + escapeHtml(formatText(state)));
                              }
                            }

                            message = parts.join(' <span class="person-sep">•</span> ');
                          }
                        }

                        return `
                          <div class="marquee-wrap">
                            <div class="marquee-fade marquee-fade-left"></div>
                            <div class="marquee-fade marquee-fade-right"></div>
                            <div class="marquee-text dynamic-sub">
                              <span class="marquee-item">${message}</span>
                              <span class="marquee-item">${message}</span>
                            </div>
                          </div>
                        `;
                      ]]]
